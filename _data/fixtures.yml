# ─────────────────────────────────────────────────────────────
#  FIXTURES & RESULTS
#
#  One block per match, oldest first.
#
#  date:      YYYY-MM-DD
#  kickoff:   optional, 24-hour time in Lagos, e.g. "15:30"
#  opponent:  the other team's name
#  home:      true if the Kings are the home side, false if away
#  venue:     the pitch
#  score:     KINGS' GOALS FIRST, then theirs, e.g. "3-2" means the Kings scored 3.
#             Leave score out for a match that hasn't been played yet.
#             It then becomes the "Next match" on the home page.
#  type:      optional label, defaults to "Friendly"
#  crest:     optional, the other team's badge, e.g. images/opponents/somebody.jpg
#  squad:     optional matchday squad, by group, e.g.  GK: [Ebuka]  DEF: [Praise, Chris]
#  lineup:    optional starting XI in order, with captain:, subs: [...] and lineup_note: (a caption).
#             Once a lineup is set it replaces the squad list on the site.
#
#  To link a match report, give the news post  match: "YYYY-MM-DD"
#  (the same date as the fixture). See README.
# ─────────────────────────────────────────────────────────────

