<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eat and Tee — Table Card</title>
  <style>
    /* ---- Colours: the same as the menu ---- */
    :root {
      --cream: #FFF7ED;
      --brown: #3B2414;
      --palm:  #C2410C;
      --mustard: #E9A23B;
    }

    /* ---- Paper size for printing: A5 portrait, no browser margins ---- */
    @page {
      size: A5 portrait;
      margin: 0;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #E7DCCD;
      color: var(--brown);
    }

    /* ---- The controls (only on screen, never printed) ---- */
    .controls {
      max-width: 560px;
      margin: 0 auto;
      padding: 20px 16px 8px;
    }
    .controls label { font-weight: 700; display: block; margin-bottom: 6px; }
    .controls input {
      width: 100%;
      font: inherit;
      font-size: 1rem;
      padding: 10px 12px;
      border: 1px solid #C9AE8C;
      border-radius: 10px;
    }
    .controls p { margin: 8px 0; font-size: 0.9rem; }
    .controls button {
      font: inherit;
      font-weight: 700;
      padding: 10px 18px;
      border: none;
      border-radius: 10px;
      background: var(--palm);
      color: var(--cream);
      cursor: pointer;
    }
    .warning { color: #9A1B0B; font-weight: 700; }

    /* ---- The card itself: exactly A5 (148mm x 210mm) ---- */
    .card {
      width: 148mm;
      height: 210mm;
      margin: 16px auto 40px;
      background: var(--cream);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(59, 36, 20, 0.25);
      /* print colours exactly, including backgrounds */
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    .card-top {
      width: 100%;
      background: var(--palm);
      color: var(--cream);
      padding: 12mm 10mm 9mm;
    }
    .card-top img { width: 26mm; height: 26mm; }
    .card-top h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 40pt;
      margin: 3mm 0 0;
      line-height: 1;
    }

    .scan {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 30pt;
      font-weight: 700;
      color: var(--palm);
      margin: 10mm 0 5mm;
    }

    .qr-frame {
      background: #FFFFFF;
      border: 1.2mm solid var(--mustard);
      border-radius: 6mm;
      padding: 4mm;
    }
    #qr svg {
      display: block;
      width: 78mm;
      height: 78mm;
    }

    .whatsapp {
      margin-top: auto;            /* push to the bottom of the card */
      width: 100%;
      padding: 7mm 10mm 10mm;
      font-size: 15pt;
      font-weight: 700;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 3mm;
      border-top: 0.6mm dashed var(--mustard);
    }
    .whatsapp svg { width: 8mm; height: 8mm; color: #25D366; }

    /* ---- When printing: hide the controls and the grey background ---- */
    @media print {
      body { background: none; }
      .controls { display: none; }
      .card { margin: 0; box-shadow: none; }
    }

    /* ---- On a phone screen, shrink the preview so it fits ---- */
    @media screen and (max-width: 600px) {
      .card { zoom: 0.6; }
    }
  </style>
</head>
<body>

  <!-- ============ CONTROLS (screen only) ============ -->
  <div class="controls">
    <label for="link">Your live menu link</label>
    <input id="link" type="url" value="https://eatandtee.netlify.app">
    <p id="link-warning" class="warning">
      ⚠️ Replace this with your real Netlify link before printing, then scan the code with your phone to check it.
    </p>
    <p>When it's right: click <strong>Save as PDF</strong>, choose <strong>Paper size: A5</strong>,
       <strong>Margins: None</strong>, and tick <strong>Background graphics</strong>.</p>
    <button id="print-btn">🖨️ Save as PDF</button>
  </div>

  <!-- ============ THE CARD ============ -->
  <div class="card">
    <div class="card-top">
      <!-- The menu's logo, copied in so the card works on its own -->
      <img alt="" src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Ccircle cx='60' cy='60' r='58' fill='%23C2410C'/%3E%3Ccircle cx='60' cy='60' r='50' fill='none' stroke='%23FFF7ED' stroke-width='2' stroke-dasharray='4 4'/%3E%3Cpath d='M48 30 q-5 6 0 12 q5 6 0 12' fill='none' stroke='%23FFF7ED' stroke-width='3' stroke-linecap='round'/%3E%3Cpath d='M60 26 q-5 6 0 12 q5 6 0 12' fill='none' stroke='%23FFF7ED' stroke-width='3' stroke-linecap='round'/%3E%3Cpath d='M72 30 q-5 6 0 12 q5 6 0 12' fill='none' stroke='%23FFF7ED' stroke-width='3' stroke-linecap='round'/%3E%3Cpath d='M30 62 h60 a30 22 0 0 1 -60 0 z' fill='%23E9A23B'/%3E%3Ctext x='60' y='78' text-anchor='middle' font-family='Georgia, serif' font-weight='bold' font-size='18' fill='%233B2414'%3EE%26amp;T%3C/text%3E%3C/svg%3E">
      <h1>Eat and Tee</h1>
    </div>

    <p class="scan">Scan to order</p>

    <div class="qr-frame">
      <div id="qr"></div>
    </div>

    <div class="whatsapp">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.1-1.2l-.4-.2Z"/></svg>
      +234 904 320 8408
    </div>
  </div>

  <!-- The QR code library (a file in this folder, so it works without internet) -->
  <script src="qrcode.min.js"></script>
  <script>
    const PLACEHOLDER = "https://eatandtee.netlify.app";
    const linkBox = document.getElementById("link");

    // Draws the QR code for whatever link is in the box
    function drawQR() {
      const link = linkBox.value.trim();
      const qr = qrcode(0, "M");   // 0 = pick the size automatically, "M" = medium error correction
      qr.addData(link);
      qr.make();
      document.getElementById("qr").innerHTML = qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true });

      // Keep the warning up until the link has been changed
      document.getElementById("link-warning").hidden = link !== PLACEHOLDER;
    }

    linkBox.addEventListener("input", drawQR);   // redraw on every keystroke
    document.getElementById("print-btn").addEventListener("click", function () {
      window.print();
    });

    drawQR();
  </script>
</body>
</html>
